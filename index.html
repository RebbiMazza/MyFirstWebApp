table {

td, th {

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* Style the header */
.header {
  grid-area: header;
  background-color: #e713bc;
  padding: 30px;
  text-align: center;
  font-size: 35px;
}

/* The grid container */
.grid-container {
  display: grid;
  grid-template-areas: 
    'header header header header header header' 
    'left left middle middle right right' 
    'footer footer footer footer footer footer';
  /* grid-column-gap: 10px; - if you want gap between the columns */
} 

.left,
.middle,
.right {
  padding: 10px;
  height: 300px; /* Should be removed. Only for demonstration */
}

/* Style the left column */
.left {
  grid-area: left;
  background-color:lightblue;
}

/* Style the middle column */
.middle {
  grid-area: middle;
}

/* Style the right column */
.right {
  grid-area: right;
}

/* Style the footer */
.footer {
  grid-area: footer;
  background-color: #87e7e7;
  padding: 10px;
  text-align: center;
}


/* Responsive layout - makes the three columns stack on top of each other instead of next to each other */
@media (max-width: 600px) {
  .grid-container  {
    grid-template-areas: 
      'header header header header header header' 
      'left left left left left left' 
      'middle middle middle middle middle middle' 
      'right right right right right right' 
      'footer footer footer footer footer footer';
  }

}
</style>
    </head>

<!--Submission blocker if forms are not filled out-->
  <script>
  function validateForm() {
  let x = document.forms["myForm"]["choice"].value;
  if (x == "") {
    alert("Your choice must be filled out to proceed!");
    return false;
  }
  else if (document.getElementById('color').value == "#000000") {
    alert("Your eye colour must be filled out to proceed!");
    return false;
  }
}
/*My Summary on choice selection in form*/

    function mySummary() {
      if (document.getElementById('choice1').checked==true){ 
          return document.getElementById('summary').innerHTML=document.getElementById('choice1').value +",they are really pretty!";}
        else if (document.getElementById('choice2').checked==true){
          return document.getElementById('summary').innerHTML=document.getElementById('choice2').value +",we will get along well!";}
        else if (document.getElementById('choice3').checked==true){
          return document.getElementById('summary').innerHTML=document.getElementById('choice3').value +",how can I blame you!";} 
      else {
        return document.getElementById('summary').innerHTML="What will you select?";} 
    }

/*Get Joke Function*/
    function displayRandomJoke() {
         const randomJoke = jokes[Math.floor(Math.random() * jokes.length)];
         jokeBox.textContent = randomJoke.content;
    }

    </script>
